spring:
  application:
    name: planmate-discovery-service
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # For the event sources and Gemini
      connect-timeout: 10s
      read-timeout: 60s
  mongodb:
    # Its own "discovery" database on the shared MongoDB, with a user that can only use that database
    uri: ${DISCOVERY_MONGODB_URI:mongodb://localhost:27017/planmate_discovery}
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

discovery:
  # An event its source stopped listing counts as cancelled after this long (only while the source fetches fine)
  stale-after: 24h
  # Of a show listed once per date (same title, same venue), publish only the next 3 dates; 0 = every date
  max-per-series: 3
  run-on-startup: true

  sources:
    ticketmaster:
      enabled: ${TICKETMASTER_ENABLED:true}
      # Every 2 hours, at a quarter past: about 60 of the 5000 requests a day the free key allows. Only new and
      # changed events go to the AI, so this costs no more AI than a slower schedule.
      cron: "0 15 */2 * * *"
      api-key: ${TICKETMASTER_API_KEY:}
      cities: [ "Munich" ]
      country-code: DE
      look-ahead: 60d
      page-size: 100
      max-pages: 5
    curated:
      enabled: ${CURATED_ENABLED:true}
      # Once a day at 03:30
      cron: "0 30 3 * * *"
      file: ${CURATED_EVENTS_FILE:classpath:curated/curated-events.yml}
    tmdb:
      enabled: ${TMDB_ENABLED:true}
      # Daily at 04:15; about 30 requests per region (TMDB allows far more)
      cron: "0 15 4 * * *"
      # The "API Key" or the "API Read Access Token" from themoviedb.org/settings/api; empty keeps TMDB off
      api-key: ${TMDB_API_KEY:}
      look-ahead: 60d
      max-movies-per-region: 25
      # Each country's cinema releases, in its language, shown in its city
      regions:
        - { code: DE, language: de-DE, city: Munich, country: Germany, time-zone: Europe/Berlin }
        - { code: BG, language: bg-BG, city: Sofia, country: Bulgaria, time-zone: Europe/Sofia }
    feeds:
      enabled: ${WEB_FEEDS_ENABLED:true}
      # Twice a day (05:45 and 17:45); the feeds run one after the other. Programmes change slowly, and this keeps
      # the AI's page reads low
      cron: "0 45 5,17 * * *"
      # Venue and city calendars; on the server: ./discovery/web-feeds.yml, read again on every run
      file: ${WEB_FEEDS_FILE:classpath:feeds/web-feeds.yml}
      # Pages with neither a calendar nor schema.org data are read by the AI (only when their text changed)
      ai-fallback: true
      ai-page-reads-per-day: 40
      look-ahead: 120d
      max-events-per-feed: 300
      max-page-bytes: 3000000
      pause: 2s

  ai:
    enabled: ${DISCOVERY_AI_ENABLED:true}
    # Discovery's own free-tier key, separate from the backend's
    api-key: ${GEMINI_DISCOVERY_API_KEY:}
    model: ${GEMINI_DISCOVERY_MODEL:gemini-3.5-flash-lite}
    batch-size: 15
    daily-limit: 300
    pause-between-requests: 5s
    # When Gemini is overloaded or rate-limited: ask again after 10s, then 30s, then leave it for the next run
    retry-delays: 10s, 30s
    prompt: classpath:prompts/event-description-refinement-prompt.txt

  topics:
    events: discovery.events
    dead-letter: discovery.events.dlq
    partitions: 3

  outbox:
    publish-interval: 5s
    batch-size: 100
