name: CI and Deploy Discovery

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE: iliandocker/planmate-docker-repo

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs all tests (MongoDB and Redpanda start in Docker through Testcontainers), then builds the jar
      - name: Test and package
        run: mvn -B package

  build-and-deploy:
    name: Build image and deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-discovery
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The moving tag docker-compose on the VM pulls, plus a per-commit tag for rollbacks
      - name: Build and push Discovery Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:planmate-discovery
            ${{ env.IMAGE }}:planmate-discovery-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/planmate
            sudo docker-compose pull discovery
            sudo docker-compose up -d --remove-orphans discovery
            sudo docker image prune -f
